name: Update Medium posts

# Pulls the latest Medium articles into the README between the
# <!-- BLOG-POST-LIST:START --> / <!-- BLOG-POST-LIST:END --> markers.
on:
  schedule:
    - cron: '0 */12 * * *' # twice a day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Pull latest Medium posts
        uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # v1
        with:
          feed_list: 'https://medium.com/feed/@debroyrishab'
          max_post_count: 5
          template: '$newline- 📝 [$title]($url)'
          commit_message: 'chore(readme): refresh latest Medium posts [skip ci]'
